[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclomatic-complexity-guard"
version = "0.1.0"
description = "AST-based complexity analyzer that flags functions exceeding threshold cognitive complexity and suggests refactoring splits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
cyclomatic-complexity-guard = "cyclomatic_complexity_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyclomatic_complexity_guard*"]
